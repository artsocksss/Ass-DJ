name: Ass-DJ AI Review

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

jobs:
  review:
    runs-on: ubuntu-latest

    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm install

      - name: AI Review Started
        run: |
          echo "Ass-DJ AI Review Running"
          echo "Branch: $GITHUB_REF"
          echo "Actor: $GITHUB_ACTOR"

      - name: Review Repository Structure
        run: |
          find . -type f | head -100
