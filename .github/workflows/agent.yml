name: Ass-DJ AI Review Agent

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest

    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm install

      - name: Show changed files
        run: |
          git diff --name-only HEAD~1 HEAD || true

      - name: Agent Online
        run: |
          echo "Ass-DJ AI Review Agent"
          echo "Gemini Enabled"
