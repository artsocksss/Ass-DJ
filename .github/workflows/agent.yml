name: Ass-DJ Code Review Agent

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  review:
    runs-on: ubuntu-latest

    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm install

      - name: Review Started
        run: |
          echo "Ass-DJ Code Review Agent Running"
          echo "Repository checked successfully"
