name: Ass-DJ AI Agent

on:
  workflow_dispatch:

jobs:
  agent:
    runs-on: ubuntu-latest

    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Agent started
        run: |
          echo "Ass-DJ AI Agent online"
